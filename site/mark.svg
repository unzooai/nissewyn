<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Nissewyn</title>
  <!-- Night: it works while you sleep. -->
  <rect width="1024" height="1024" rx="224" fill="#1E2A47"/>
  <!-- A small star by the cap's tip. -->
  <path d="M770 214 l16 40 l40 16 l-40 16 l-16 40 l-16 -40 l-40 -16 l40 -16 z" fill="#FFD36B"/>
  <!-- Beard: wide, soft, scalloped at the bottom. -->
  <path d="M268 556
           C268 556 286 742 362 818
           C392 848 428 846 452 828
           C476 872 548 872 572 828
           C596 846 632 848 662 818
           C738 742 756 556 756 556 Z" fill="#F6F1E7"/>
  <!-- Cap: tall, pulled down over the eyes, its tip leaning over. -->
  <path d="M236 592
           C236 592 300 470 372 356
           C430 264 500 186 600 160
           C660 146 708 168 726 196
           C690 196 652 214 630 252
           C600 304 640 420 788 592 Z" fill="#E5483B"/>
  <!-- Cap brim. -->
  <rect x="220" y="560" width="584" height="72" rx="36" fill="#C7362B"/>
  <!-- Nose. -->
  <circle cx="512" cy="664" r="64" fill="#F2A98A"/>
</svg>
