name: release-linux

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach Linux packages to (e.g. v0.1.7)"
        required: true
        default: "v0.1.7"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            unterm -> target
            apps/nissewyn/src-tauri -> target

      - name: Install Linux desktop & Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            pkg-config \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-ewmh-dev \
            libxcb-randr0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Linux .deb and .AppImage
        run: bash apps/nissewyn/build-linux.sh

      - name: Upload Linux packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          BUNDLE_DIR="apps/nissewyn/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          ASSETS=()
          for f in "$BUNDLE_DIR"/deb/*.deb "$BUNDLE_DIR"/appimage/*.AppImage; do
            if [ -f "$f" ]; then
              ASSETS+=("$f")
            fi
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "error: no Linux bundle artifacts found" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --title "Nissewyn ${TAG_NAME}" --generate-notes
          fi
