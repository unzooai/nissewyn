<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xtools</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14171a;--soft:#536471;--muted:#8b98a5;--line:#e6e9ec;--blue:#1d9bf0;--green:#00a36c;--amber:#c77700;--red:#e0245e;--radius:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--panel:#16202a;--ink:#e7e9ea;--soft:#a5b1bd;--muted:#71808f;--line:#2a3640}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
/* Inside the app (Nissewyn shows the name and refreshes it): the page starts at its status. */
.embedded header h1,.embedded header>button{display:none}.embedded header{margin-bottom:8px}
button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--soft)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.danger{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:70px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 18px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header h1{font-size:20px;margin:0}
.chart{width:100%;height:140px;display:block}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:4px;gap:8px}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px}.bar{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.stack{width:100%;height:100%;display:flex;flex-direction:column-reverse}.stack div{width:100%;min-height:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--soft);font-weight:500}.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line)}
.meter{display:inline-block;width:60px;height:6px;background:var(--line);border-radius:3px;margin-right:6px;vertical-align:middle;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}
.range{display:flex;gap:6px;align-items:center;margin-bottom:12px}.range button.on{border-color:var(--blue);color:var(--blue)}
.bad{color:var(--red)}
.autofill{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 14px}.autofill b{margin-right:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;background:var(--line);color:var(--soft)}
.pill.ok{background:rgba(0,163,108,.12);color:var(--green)}
.pill.warn{background:rgba(199,119,0,.14);color:var(--amber)}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:-4px 0 14px}
.status b{font-size:15px}.status .dot{display:inline-block}
.status.ok{border-color:rgba(0,163,108,.4);background:rgba(0,163,108,.06)}.status.ok .dot{color:var(--green)}
.status.wait{border-color:rgba(199,119,0,.4);background:rgba(199,119,0,.06)}.status.wait .dot{color:var(--amber)}
.status.bad{border-color:rgba(224,36,94,.4);background:rgba(224,36,94,.06)}.status.bad .dot{color:var(--red)}
.status.live .dot{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.25}}
.pill.bad{background:rgba(224,36,94,.12);color:var(--red)}
.grow{flex:1}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs a{padding:9px 14px;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
nav.tabs a .n{background:var(--blue);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi b{font-size:22px;display:block}
.kpi span{color:var(--soft);font-size:12px}
.muted{color:var(--muted)}
.soft{color:var(--soft)}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px}
.item:first-child{border-top:none}
.item .when{width:92px;flex:none;color:var(--soft);font-size:12px}
.item .body{flex:1;min-width:0}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.text{white-space:pre-wrap;word-break:break-word}
.part{border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.target{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--soft);margin-bottom:6px;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto}
.item.sel{background:rgba(29,155,240,.06)}
.tag{font-size:12px;color:var(--soft)}
.log div{font-size:12px;padding:3px 0;border-top:1px dashed var(--line)}
.log .warn{color:var(--amber)}
.spark{width:100%;height:60px}
.pillar{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.hint{font-size:12px;color:var(--soft);margin:4px 0 0}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;max-width:420px}
.notice{border:1px solid rgba(199,119,0,.4);background:rgba(199,119,0,.07);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
a.link{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">…</p></div>
<div class="toast" id="toast"></div>
<script>
if (window.self !== window.top) document.documentElement.classList.add('embedded');
// Language: Nissewyn opens the page with ?lang=; on its own, the browser's language. The Chinese
// text is the key (as in Nissewyn): T('刷新') is '刷新' in Chinese and the catalog's English otherwise.
const LANG=(()=>{const q=new URLSearchParams(location.search).get('lang');
  const l=q||(navigator.languages&&navigator.languages[0])||navigator.language||'';return /^zh/i.test(l)?'zh':'en'})();
document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
let DICT={};
function T(s,v){const t=LANG==='zh'?s:(DICT[s]??s);return v?t.replace(/\{(\w+)\}/g,(w,n)=>n in v?String(v[n]):w):t}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){const h={'X-Lang':LANG};const r=await fetch(p,b===undefined?{headers:h}:{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',4000)}
const fmt=ts=>{if(!ts)return '';const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const num=n=>n==null?'—':LANG==='zh'?(n>=1e4?(n/1e4).toFixed(1)+'万':String(n)):(n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':String(n));
const KIND={reply:'回复',quote:'引用',like:'点赞',follow:'关注'};
const MODE={auto:'自动',approve:'先批准',off:'不做'};
const AUTO={posts:'原创',mentions:'回读者',replies:'前排回复',quotes:'引用',likes:'点赞',follows:'关注'};
const STAGE=['','只逛','开口','起步'];
let S=null, TAB=localStorage.getItem('xt_tab')||'today', SEL=0;

async function load(){S=await api('/api/state');render()}
function setTab(t){TAB=t;try{localStorage.setItem('xt_tab',t)}catch(e){};render()}

function header(){
  const t=S.status||{},icon={on:'●',working:'●',waiting:'●',off:'○',problem:'▲'}[t.state]||'○';
  const cls={on:'ok',working:'ok',waiting:'wait',off:'',problem:'bad'}[t.state]||'';
  const beat=t.beat?T('最近检查 {ago}',{ago:ago(t.beat)}):'';
  return `<div id="hdr"><header><h1>Xtools</h1><span class="soft">${S.handle?'@'+esc(S.handle):''}</span><span class="grow"></span>
    ${S.browser?'':`<span class="pill bad">${T('Unzoo 浏览器没连上')}</span>`}
    <button onclick="load()">${T('刷新')}</button></header>
    <div class="status ${cls} ${t.state==='working'?'live':''}"><b><span class="dot">${icon}</span> ${esc(t.text||'')}</b>
      ${S.warmup?`<span class="pill warn">${T('养号期 · {stage}',{stage:esc(S.warmup.name)})}</span>`:''}
      <span class="soft">${esc(t.detail||'')}</span><span class="grow"></span>
      ${t.next&&t.state!=='off'?`<span class="soft">${T('下一件:{what}',{what:esc(t.next)})}</span>`:''}
      <span class="muted">${beat}</span>
      ${S.halted?`<button onclick="resume()">${T('恢复')}</button>`:''}</div></div>`;
}
function ago(ts){const s=Math.max(0,Math.round(Date.now()/1000-ts));return s<60?T('{n} 秒前',{n:s}):T('{n} 分钟前',{n:Math.round(s/60)})}
// The status line stays live: every 10 seconds, only the header is redrawn (nothing you are editing moves).
setInterval(async()=>{try{S=await api('/api/state');const h=$('#hdr');if(h)h.outerHTML=header()}catch(e){
  const h=$('#hdr');if(h)h.innerHTML=`<div class="status bad"><b><span class="dot">▲</span> ${T('Xtools 没有响应')}</b><span class="soft">${T('插件可能已关掉;到 Nissewyn › 插件 里打开它')}</span></div>`}},10000);

function render(){
  if(!S)return;
  const app=$('#app');
  if(!S.setup){renderOnboarding(app);return}
  const tabs=[['today','今天'],['stats','数据'],['queue','队列'],['posts','原创'],['radar','雷达'],['book','打法'],['report','周报'],['log','记录']];
  app.innerHTML=header()+`<nav class="tabs">${tabs.map(([k,l])=>`<a class="${TAB===k?'on':''}" onclick="setTab('${k}')">${T(l)}${k==='queue'&&S.queue.pending?`<span class="n">${S.queue.pending}</span>`:''}</a>`).join('')}</nav><div id="view"></div>`;
  ({today:vToday,stats:vStats,queue:vQueue,posts:vPosts,radar:vRadar,book:vBook,report:vReport,log:vLog})[TAB]();
}
const autoList=sep=>Object.entries(S.automation).map(([k,v])=>T('{what}:{mode}',{what:T(AUTO[k]),mode:T(MODE[v])})).join(sep);

// ---- first run
function onboarding(){
  const bound=S.profile_bound,d=S.about_draft||{},busy=!!S.running.job;
  return `<div class="card"><h2>${T('开始:告诉 Xtools 你是谁')}</h2>
   <p class="soft">${T('它会先读你的 X 主页和最近的帖,学你的说话方式、看哪类内容表现好,再给出一套打法(内容支柱、关键词、要盯的同行)。之后每天按读者作息发原创、在同行新帖下前排回复、接住读者,每周按效果调整。')}</p>
   ${bound?'':`<div class="notice">${T('还没指定用哪个浏览器身份:到 Nissewyn › 插件 › Xtools › 设置 › 账号与模型,选登录了你 X 账号的那个。')}</div>`}
   <div class="autofill"><b>${T('自动填写')}</b><span class="soft">${T('读完后填进下面三项,你再改')}</span>
     <div class="row" style="margin-top:8px;align-items:flex-end">
       <div style="flex:0 0 auto"><button ${bound&&!busy?'':'disabled'} onclick="autofill('account')">${T('读我的 X 账号')}</button></div>
       <div style="flex:2;min-width:220px"><label>${T('或者,我的网站')}</label><input id="ob_site" placeholder="https://example.com" value="${esc(d.site||'')}" oninput="saveAbout()"></div>
       <div style="flex:0 0 auto"><button ${bound&&!busy?'':'disabled'} onclick="autofill('site')">${T('读我的网站')}</button></div></div></div>
   <label>${T('我是谁、做什么')}</label><textarea id="ob_who" oninput="saveAbout()" placeholder="${esc(T('例:独立开发者,做给设计师用的效率工具;或:健身教练,专做上班族的减脂'))}">${esc(d.who||'')}</textarea>
   <div class="row" style="margin-top:10px"><div><label>${T('想吸引的人')}</label><input id="ob_aud" oninput="saveAbout()" value="${esc(d.audience||'')}" placeholder="${esc(T('例:海外的独立开发者和小团队'))}"></div>
   <div><label>${T('目标')}</label><input id="ob_goal" oninput="saveAbout()" value="${esc(d.goal||'')}" placeholder="${esc(T('例:涨粉;给我的网站引流;建立专业影响力'))}"></div></div>
   <p class="hint" id="ob_saved">${d.who||d.audience||d.goal?T('已保存,关掉再打开也还在。'):T('填的内容会自动保存。')}</p>
   <div class="notice" style="margin-top:14px">${T('默认是<b>全自动</b>:发原创、回读者、前排回复、引用、点赞、关注都会直接做。X 的自动化规则不允许按关键字或批量自动回复、关注、点赞,账号被限流或封禁的风险由你承担。每一类都可以在设置里改成「先给我批准」或「不做」;现在:{now}。',{now:autoList(' · ')})}</div>
   <button class="primary" ${bound&&!busy?'':'disabled'} onclick="startSetup()">${T('完成,生成打法并开始')}</button>
   <div id="ob_live">${obLive()}</div>
   <p class="hint">${T('生成打法后,上面会出现「今天」「数据」「队列」等页:运行的统计在「数据」页。')}</p>
   </div><div id="ob_log">${logCard(8)}</div>`;
}
function obLive(){return S.running.job?`<p class="hint">${T('正在:{job}…(大约一两分钟)',{job:esc(S.running.job)})}</p>`:''}
function aboutNow(){return {who:$('#ob_who').value,audience:$('#ob_aud').value,goal:$('#ob_goal').value,site:$('#ob_site').value.trim()}}
function saveAbout(){clearTimeout(saveAbout._t);saveAbout._t=setTimeout(async()=>{const r=await api('/api/about/save',aboutNow());
  const el=$('#ob_saved');if(el)el.textContent=r.ok?T('已保存,关掉再打开也还在。'):T('没保存上')},500)}
async function autofill(source){
  const a=aboutNow();await api('/api/about/save',a);
  if(source==='site'&&!/^https?:\/\/\S+\.\S+/.test(a.site)){toast(T('先填网站地址,以 https:// 开头'));return}
  const r=await api('/api/about/draft',{source,url:a.site});
  toast(r.ok?(source==='site'?T('在读网站…'):T('在读 X 账号…')):T('没开始:{error}',{error:r.error||''}));OB_AT=null;poll();
}
async function startSetup(){
  const r=await api('/api/setup',aboutNow());
  toast(r.ok?T('开始读账号、生成打法…'):T('没开始:{error}',{error:r.error||''}));poll();
}
// The form is drawn once; refreshing the page's state only updates the status around it,
// and fills the fields again only when an automatic fill has finished (so typing is never lost).
let OB_AT=undefined;
function renderOnboarding(app){
  const at=(S.about_draft||{}).at||0, drawn=$('#ob_who');
  if(drawn&&OB_AT!==null&&OB_AT===at){
    const h=$('#hdr');if(h)h.outerHTML=header();
    $('#ob_live').innerHTML=obLive();$('#ob_log').innerHTML=logCard(8);
    document.querySelectorAll('.autofill button, button.primary').forEach(b=>b.disabled=!S.profile_bound||!!S.running.job);
    return;
  }
  if(OB_AT===null&&S.running.job&&drawn){$('#ob_live').innerHTML=obLive();$('#ob_log').innerHTML=logCard(8);const h=$('#hdr');if(h)h.outerHTML=header();return}
  OB_AT=at;app.innerHTML=header()+onboarding();
}
function poll(){clearTimeout(poll._t);poll._t=setTimeout(async()=>{await load();if(S.running.job)poll()},3000)}

// ---- today
function spark(snaps){
  if(!snaps||snaps.length<2)return `<p class="muted">${T('粉丝趋势:记录两天以上后显示')}</p>`;
  const v=snaps.map(s=>s.followers),lo=Math.min(...v),hi=Math.max(...v)||1,w=300,h=60;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-4-(y-lo)/((hi-lo)||1)*(h-8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${pts}"/></svg>`;
}
const counts=p=>T('{views} 浏览 · {likes} 赞 · {replies} 回复',{views:num(p.views),likes:num(p.likes),replies:num(p.replies)});
function vToday(){
  const t=S.today,f=S.followers,last=f.length?f[f.length-1].followers:null,first=f.length?f[0].followers:null;
  const post=p=>`<div class="item"><div class="when">${p.status==='published'?T('已发 {at}',{at:fmt(p.published_at).slice(6)}):(p.due||T('草稿'))}<br><span class="tag">${esc(p.pillar||'')}</span></div>
    <div class="body">${p.parts.map(x=>`<div class="part text">${esc(x)}</div>`).join('')}
    <div class="acts">${p.status==='published'?(p.url?`<a class="link" href="${esc(p.url)}" target="_blank">${T('在 X 上看')}</a> <span class="tag">${counts(p)}</span>`:''):
      `<span class="pill ${p.status==='scheduled'?'ok':p.status==='failed'?'bad':''}">${({scheduled:T('已排程'),draft:T('草稿,等你批准'),failed:T('没发出:{error}',{error:esc(p.error||'')})})[p.status]||p.status}</span>
       ${p.status!=='scheduled'?`<button onclick="schedule(${p.id})">${T('批准并排程')}</button>`:`<button onclick="unschedule(${p.id})">${T('撤回')}</button>`}
       <button onclick="publishNow(${p.id})">${T('立刻发')}</button><button onclick="editPost(${p.id})">${T('改')}</button><button class="danger" onclick="delPost(${p.id})">${T('删')}</button>`}</div></div></div>`;
  $('#view').innerHTML=`<div class="kpis">
    <div class="kpi"><b>${num(last)}</b><span>${T('粉丝')}${first!=null&&last!=null?T(' · 近期 {change}',{change:(last-first>=0?'+':'')+(last-first)}):''}</span></div>
    <div class="kpi"><b>${t.posts.filter(p=>p.status==='published').length} / ${t.posts.length}</b><span>${T('今天原创:已发 / 计划')}</span></div>
    <div class="kpi"><b>${t.done.reply}</b><span>${T('今天回复 · 还能 {n}',{n:t.left.reply})}</span></div>
    <div class="kpi"><b>${t.done.like} · ${t.done.follow}</b><span>${T('点赞 · 关注')}</span></div>
    <div class="kpi"><b>${S.queue.pending}</b><span>${T('等你批准')}</span></div></div>
   ${warmCard()}
   <div class="row"><div class="card" style="flex:2"><h2>${T('今天的原创')}</h2>${t.posts.length?t.posts.map(post).join(''):`<p class="muted">${T('今天还没有。到时间会自动写,也可以现在写一条。')}</p>`}
     <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button onclick="writeOne()">${T('写一条')}</button><button onclick="run('plan')">${T('按计划补齐今天')}</button></div></div>
   <div style="flex:1;min-width:260px"><div class="card"><h2>${T('粉丝')}</h2>${spark(f)}</div>
     <div class="card"><h2>${T('今天的互动会话')}</h2>${t.sessions.length?t.sessions.map(s=>`<div>${s.done?'✓':'·'} ${esc(s.at)}</div>`).join(''):`<p class="muted">${T('还没排')}</p>`}
     <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button onclick="run('session')">${T('现在跑一场')}</button><button onclick="run('radar')">${T('看一圈领域')}</button><button onclick="run('mentions')">${T('看通知')}</button></div></div>
     <div class="card"><h2>${T('自动化')}</h2>${Object.entries(S.automation).map(([k,v])=>`<div class="soft">${T('{what}:{mode}',{what:T(AUTO[k]),mode:T(MODE[v])})}</div>`).join('')}<p class="hint">${T('在 Nissewyn › 插件 › Xtools › 设置 里改')}</p></div></div></div>
   ${logCard(10)}`;
}

function warmCard(){const w=S.warmup;if(!w)return '';
  const steps=[1,2,3].map(i=>`<span class="pill ${i===w.stage?'warn':i<w.stage?'ok':''}">${i<w.stage?'✓ ':''}${T(STAGE[i])}</span>`).join(' → ');
  const next=w.stage<3?T('{at} 进入「{stage}」,',{at:esc(w.next),stage:T(STAGE[w.stage+1])}):'';
  return `<div class="card"><h2>${T('养号期 · 第 {day} / {days} 天',{day:w.day,days:w.days})}</h2><div style="margin:6px 0">${steps}</div>
    <p>${T('现在是「{stage}」:{what}。{next}{end} 结束(都是这台电脑的时间)。',{stage:esc(w.name),what:esc(w.what),next,end:esc(w.end)})}</p>
    ${w.todo.length?`<p class="hint">${T('趁这几天把主页补齐(X 对空主页的新号更警惕):{todo}。',{todo:w.todo.map(esc).join(T(';'))})}</p>`:''}
    <p class="hint">${w.mode==='on'?T('设置里选了「总是养号」。'):T('因为这是新号或小号(粉丝不到 500 或注册不到半年)。')}${T('在设置 › 上限与节奏 里可以改天数或关掉。')}</p>
    <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap"><button onclick="warmup('end')">${T('提前结束')}</button><button onclick="warmup('restart')">${T('从今天重新算')}</button></div></div>`}

async function editPost(id){

// ---- queue
let QUEUE=[];
async function vQueue(){
  const [p,q]=await Promise.all([api('/api/actions?status=pending'),api('/api/actions?status=queued')]);
  QUEUE=p.items;SEL=Math.min(SEL,Math.max(0,QUEUE.length-1));
  const row=(a,i,pending)=>`<div class="item ${pending&&i===SEL?'sel':''}" id="qa_${a.id}"><div class="when">${T(KIND[a.kind]||a.kind)}<br><span class="tag">${esc(T(a.reason||''))}</span></div>
    <div class="body">${a.target_text?`<div class="target">@${esc(a.target_handle)}:${esc(a.target_text)}</div>`:`<div class="target">@${esc(a.target_handle||'')}</div>`}
    ${a.text?`<div class="text">${esc(a.text)}</div>`:''}
    <div class="acts">${pending?`<button class="primary" onclick="approve([${a.id}])">${T('批准')}</button><button onclick="reject([${a.id}])">${T('不要')}</button>`:`<button onclick="reject([${a.id}])">${T('取消')}</button>`}
    ${a.text?`<button onclick="editAction(${a.id})">${T('改')}</button>`:''}${a.target_url?`<a class="link" href="${esc(a.target_url)}" target="_blank">${T('原帖')}</a>`:''}</div></div></div>`;
  $('#view').innerHTML=`<div class="card"><h2>${T('等你批准 ({n})',{n:QUEUE.length})}</h2>
    <p class="hint">${T('键盘:<kbd>j</kbd>/<kbd>k</kbd> 上下,<kbd>a</kbd> 批准,<kbd>x</kbd> 不要。批准后按节奏在下一场会话里做。')}</p>
    ${QUEUE.length?`<div class="acts" style="display:flex;gap:6px;margin:8px 0"><button class="primary" onclick="approve(QUEUE.map(a=>a.id))">${T('全部批准')}</button></div>`+QUEUE.map((a,i)=>row(a,i,true)).join(''):`<p class="muted">${T('没有。默认全自动时这里是空的;在设置里把某类改成「先给我批准」,它们会出现在这里。')}</p>`}</div>
   <div class="card"><h2>${T('排队中,下一场会话做 ({n})',{n:q.items.length})}</h2>${q.items.length?q.items.map((a,i)=>row(a,i,false)).join(''):`<p class="muted">${T('没有')}</p>`}
    <div class="acts" style="display:flex;gap:6px;margin-top:8px"><button onclick="run('frontrow')">${T('起草前排回复')}</button><button onclick="run('quotes')">${T('起草引用')}</button><button onclick="run('follows')">${T('找要关注的人')}</button><button onclick="run('session')">${T('现在跑一场')}</button></div></div>`;
}
async function approve(ids){await api('/api/actions/approve',{ids});await load()}
async function reject(ids){await api('/api/actions/reject',{ids});await load()}
async function editAction(id){const a=[...QUEUE].find(x=>x.id===id)||(await api('/api/actions?status=queued')).items.find(x=>x.id===id);const t=prompt(T('改这条'),a.text);if(t==null)return;await api('/api/actions/edit',{id,text:t});load()}
document.addEventListener('keydown',e=>{
  if(TAB!=='queue'||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||!QUEUE.length)return;
  if(e.key==='j'){SEL=Math.min(SEL+1,QUEUE.length-1);vQueue()}
  else if(e.key==='k'){SEL=Math.max(SEL-1,0);vQueue()}
  else if(e.key==='a')approve([QUEUE[SEL].id]);
  else if(e.key==='x')reject([QUEUE[SEL].id]);
});

async function vBook(){

function pillarRow(p,i){return `<div class="pillar"><div class="row"><div style="flex:2"><input placeholder="${esc(T('名字'))}" value="${esc(p.name)}" oninput="BOOK.pillars[${i}].name=this.value"></div><div style="flex:0 0 110px;min-width:110px"><input type="number" step="0.1" min="0" value="${p.weight??1}" oninput="BOOK.pillars[${i}].weight=+this.value" title="${esc(T('权重'))}"></div><div style="flex:0 0 auto;min-width:0"><button class="danger" onclick="BOOK.pillars.splice(${i},1);vBookRefresh()">${T('删')}</button></div></div>
  <textarea style="margin-top:6px" placeholder="${esc(T('写什么、为什么读者在乎'))}" oninput="BOOK.pillars[${i}].what=this.value">${esc(p.what)}</textarea>
  <input style="margin-top:6px" placeholder="${esc(T('选题例子,用 ; 隔开'))}" value="${esc((p.examples||[]).join('; '))}" oninput="BOOK.pillars[${i}].examples=this.value.split(/[;；]/).map(s=>s.trim()).filter(Boolean)"></div>`}
function vBookRefresh(){$('#b_pillars').innerHTML=BOOK.pillars.map((p,i)=>pillarRow(p,i)).join('')}
async function saveBook(){

// ---- numbers
let DAYS=30;try{DAYS=+localStorage.getItem('xt_days')||30}catch(e){}
function lineChart(pts,key){
  if(pts.length<2)return `<p class="muted">${T('记录两天以上后显示趋势(每天自动记一次,也可以点「现在记录数据」)')}</p>`;
  const v=pts.map(p=>p[key]),lo=Math.min(...v),hi=Math.max(...v),w=600,h=140,pad=4;
  const xy=v.map((y,i)=>[(i/(v.length-1)*w),(h-pad-(y-lo)/((hi-lo)||1)*(h-2*pad))]);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(T('粉丝从 {lo} 到 {hi}',{lo,hi}))}">
    <polyline fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke" points="${xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/></svg>
    <div class="axis"><span>${esc(pts[0].day)} · ${num(v[0])}</span><span>${T('最高 {hi} · 最低 {lo}',{hi:num(hi),lo:num(lo)})}</span><span>${esc(pts[pts.length-1].day)} · ${num(v[v.length-1])}</span></div>`;
}
const SERIES=[['post','原创','var(--blue)'],['reply','回复','var(--green)'],['quote','引用','var(--amber)'],['like','点赞','#9aa4b2'],['follow','关注','#b08cd9']];
function bars(act){
  const max=Math.max(1,...act.map(a=>SERIES.reduce((s,[k])=>s+a[k],0)));
  return `<div class="legend">${SERIES.map(([k,l,c])=>`<span><i style="background:${c}"></i>${T(l)}</span>`).join('')}</div>
   <div class="bars">${act.map(a=>`<div class="bar" title="${esc(a.day)}:${SERIES.map(([k,l])=>T(l)+' '+a[k]).join(' · ')}">
     <div class="stack">${SERIES.map(([k,,c])=>a[k]?`<div style="height:${a[k]/max*100}%;background:${c}"></div>`:'').join('')}</div></div>`).join('')}</div>
   <div class="axis"><span>${esc(act[0].day)}</span><span>${esc(act[act.length-1].day)}</span></div>`;
}
function table(rows,first,empty){
  if(!rows.length)return `<p class="muted">${empty}</p>`;
  const best=Math.max(1,...rows.map(r=>r.views));
  return `<table class="tbl"><tr><th>${first}</th><th>${T('条数')}</th><th>${T('平均浏览')}</th><th>${T('平均赞')}</th><th>${T('互动分')}</th></tr>${rows.map(r=>`<tr><td>${esc(String(r.name))}</td><td>${r.n}</td>
    <td><span class="meter"><i style="width:${r.views/best*100}%"></i></span>${num(r.views)}</td><td>${num(r.likes)}</td><td>${r.score}</td></tr>`).join('')}</table>`;
}

    <div class="kpi"><b>${num(d.posts.views)}</b><span>${T('原创平均浏览({n} 条)',{n:d.posts.n})}</span></div>

   <div class="card"><h2>${T('粉丝')}</h2>${lineChart(f,'followers')}</div>
   <div class="card"><h2>${T('每天做了什么')}</h2>${bars(d.activity)}
     <p class="soft">${T('{days} 天合计:原创 {post} · 回复 {reply} · 引用 {quote} · 点赞 {like} · 关注 {follow}',{days:d.days,...d.totals})}${d.failed?` · <span class="bad">${T('失败 {n}',{n:d.failed})}</span>`:''}</p></div>

     <div class="card" style="flex:1;min-width:280px"><h2>${T('格式')}</h2>${table(d.by_format,T('格式'),'—')}</div></div>

   <p class="hint">${T('数据每天记录一次(粉丝数,以及最近 40 条帖和回复的浏览、赞、回复),只存在这台电脑上。')}</p>`;
}
