[package]
name = "nissewyn"
version = "0.1.7"
description = "Nissewyn — the desktop client"
edition = "2021"
license = "BUSL-1.1"
publish = false

# Its own workspace: the client is not part of the runtime's (unterm/) build.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Where the background service records itself: the one answer every process
# has to agree on.
unterm-protocol = { path = "../../../unterm/unterm-protocol" }
rfd = "0.15"
# Settings › Organization: joining a company's own Nissewyn Server.
# native-tls: the system's TLS, so a company's internal root CA is trusted
# the way the rest of the computer trusts it.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# The device key in the system's key store; same crate and backends as the
# runtime's profile secrets (unterm-profile).
keyring = { version = "2.3", default-features = false, features = [
  "platform-macos",
  "platform-windows",
  "linux-secret-service-rt-async-io-crypto-rust",
] }
# sync: one membership change at a time; net/io-util/time/macros: the
# loopback address the browser comes back to after signing in.
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "macros"] }
# The system browser, for signing in with the company account.
open = "5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true

[target."cfg(windows)".dependencies]
# The Run key for start-at-sign-in, through the registry API.
winreg = "0.10"
